[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shipkit"
version = "0.9.0"
description = "ShipKit - Safe Deployment & Rollback Tool"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.25",
    "PyYAML>=5.4",
]

[project.optional-dependencies]
keyring = ["keyring>=23"]
dev = ["pytest>=7"]
gui = ["PySide6>=6.6", "paramiko>=3.2"]   # 화면 + 서버에 바로 올리기(SSH/SFTP)
ssh = ["paramiko>=3.2"]
build = ["pyinstaller>=6"]

[project.scripts]
shipkit = "shipkit.cli:main"

[project.gui-scripts]
shipkit-gui = "shipkit.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shipkit = ["templates/*", "gui/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
